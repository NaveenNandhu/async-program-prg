<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meme Shower</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="frame">
      <nav>
        <div class="navbar-container">
          <div class="nav-brand">
            <img src="assets/meme.png" alt="brand-logo" />
            <h3>MemerUI</h3>
          </div>
          <div class="nav-links">
            <ul>
              <li>About us</li>
              <li>Explore Memes</li>
              <li>Help Us</li>
            </ul>
          </div>
          <div class="side-menu-icon">
            <img src="assets/menu.png" alt="side-menu" />
          </div>
        </div>
      </nav>
      <section>
        <div class="joke-frame">
          <div class="joke-container">
            <div class="meme-frame">
              <img src="assets/meme.png" alt="meme.jpg" width="400px" class="meme-image"/>
            </div>
            <div>
              <button class="next-btn" onclick="getMemes()">Next Meme</button>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script src="index.js"></script>
  </body>
</html>
